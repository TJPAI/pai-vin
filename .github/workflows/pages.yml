name: Publish PAI-VIN PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate SLAM-only app
        run: |
          python3 -m py_compile tools/prepare_slam_dataset.py tools/run_colmap_baseline.py
          python3 tests/test_colmap_parser.py
          test -s docs/SLAM_DATASET.md
          node --check slam-capture.js
          node --check web-vio-demo.js
          node --check web-vio-geometry.js
          node --check web-vio-features.js
          node tests/web-vio-features.test.cjs
          node --check web-vio-pose.js
          node tests/web-vio-pose.test.cjs
          node --check web-vio-inertial.js
          node tests/web-vio-inertial.test.cjs
          node tests/web-vio-geometry.test.cjs
          test -s web-vio-demo.html
          grep -q 'web-vio-demo.html' index.html
          node --check sw.js
          test -s a4-board.html
          test -s index.html
          grep -q 'slam-capture.js' index.html
          grep -q 'a4-board.html' index.html
          grep -q 'slam-capture.js' sw.js
          if grep -Eq 'app.js|storage.js|auto-lift.js|heading.js|vision.js' index.html; then
            echo 'Legacy scripts must not be loaded'
            exit 1
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
