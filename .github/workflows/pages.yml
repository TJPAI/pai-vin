name: Publish PAI-VIN VIO PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate active VIO code
        run: |
          node --check vin-a4-board.js
          node --check vin-app.js
          node --check vio-sensor-core.js
          node --check vio-sensor-probe.js
          node --check vio-tracker.js
          node --check vio-initializer.js
          node tests/vio-initializer.test.cjs
          node --check web-vio-features.js
          node --check sw.js
          node tests/vin-a4-board.test.cjs
          node tests/vio-sensor-core.test.cjs
          node tests/vio-tracker.test.cjs
          node tests/web-vio-features.test.cjs
          node tests/vio-clean-app.test.cjs
      - name: Assemble minimal site
        run: |
          mkdir -p dist
          cp index.html vin-app.html vin-app.js manifest.json a4-board.html vin-a4-board.js web-vio-features.js vio-sensor-core.js vio-tracker.js vio-initializer.js vio-sensor-probe.js sw.js dist/
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 12
          ! grep -R 'web-vio-demo\|vin-vo-path\|vin-scan' dist/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload clean PWA
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
