name: Publish PAI-VIN PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check browser JavaScript syntax and required files
        run: |
          node --check slam-capture.js
          test -s a4-board.html
          grep -q 'slam-capture.js' index.html
          grep -q 'slam-capture.js' sw.js
          grep -q 'a4-board.html' index.html
          node --check app.js
          node --check storage.js
          node --check map-view.js
          node --check heading.js
          grep -q 'heading.js' index.html
          grep -q 'heading.js' sw.js
          grep -q 'map-view.js' index.html
          grep -q 'map-view.js' sw.js
          grep -q 'storage.js' index.html
          grep -q 'storage.js' sw.js
          node --check vision.js
          node --check auto-lift.js
          node --check sw.js
          node tests/vision-smoke.cjs
          test -s index.html
          test -s manifest.json
          grep -q 'vision.js' index.html
          grep -q 'auto-lift.js' index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
