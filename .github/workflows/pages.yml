name: Publish PAI-VIN VIO PWA
# Recovery: start a NEW run when an old run has duplicate github-pages
# artifacts from multiple attempts; re-running the same ID accumulates them.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['PAI-VIN Stella WASM feasibility probe']
    types: [completed]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate active VIO code
        run: |
          node --check vin-a4-board.js
          node --check vin-a4-detect.js
          node tests/vin-a4-detect.test.cjs
          node --check vio-grid-board.js
          node tests/vio-grid-board.test.cjs
          node --check vio-focal.js
          node tests/vio-focal.test.cjs
          node --check vio-viewport.js
          node tests/vio-viewport.test.cjs
          node --check vin-app.js
          node --check vio-sensor-core.js
          node --check vio-sensor-probe.js
          node --check vio-tracker.js
          node --check vio-keyframes.js
          node --check vio-track-repair.js
          node tests/vio-track-repair.test.cjs
          node tests/vio-keyframes.test.cjs
          node --check vio-initializer.js
          node --check vio-preintegration.js
          node tests/vio-preintegration.test.cjs
          node --check vio-calibration.js
          node tests/vio-calibration.test.cjs
          node --check vio-rotation.js
          node --check vio-vo-state.js
          node tests/vio-vo-state.test.cjs
          node --check vio-geometry.js
          node tests/vio-geometry.test.cjs
          node --check vio-fusion.js
          node --check vio-observation.js
          node --check vio-vision-worker.js
          node tests/vio-worker-contract.test.cjs
          node tests/vio-observation.test.cjs
          node tests/vio-rotation.test.cjs
          node tests/vio-fusion.test.cjs
          node tests/vio-initializer.test.cjs
          node --check web-vio-features.js
          node --check sw.js
          node tests/vin-a4-board.test.cjs
          node tests/vio-sensor-core.test.cjs
          node tests/vio-tracker.test.cjs
          node tests/web-vio-features.test.cjs
          node tests/vio-clean-app.test.cjs
          node tests/v4-alva.test.cjs
          node tests/v4-alva-segments.test.cjs
          node tests/v4-alva-trace.test.cjs
          node --check v4-map-contract.js
          node --check v4-stella-worker.js
          node -e "const fs=require('fs'),vm=require('vm'); const s=fs.readFileSync('v4-stella-test.html','utf8'); const m=s.match(/<script>([\\s\\S]*?)<\\/script>/); if(!m) throw Error('No inline Stella UI JS'); new vm.Script(m[1]);"
          node tests/v4-map-contract.test.cjs
      - name: Assemble minimal site
        run: |
          mkdir -p dist
          cp index.html vin-app.html vin-app.js vio-focal.js vio-viewport.js manifest.json a4-board.html a4-grid-board.html vin-a4-board.js vin-a4-detect.js vio-grid-board.js web-vio-features.js vio-sensor-core.js vio-tracker.js vio-keyframes.js vio-track-repair.js vio-initializer.js vio-preintegration.js vio-calibration.js vio-rotation.js vio-geometry.js vio-vo-state.js vio-fusion.js vio-observation.js vio-vision-worker.js vio-sensor-probe.js sw.js dist/
          cp v4-alva-test.html v4-alva-test.js v4-alva-segments.js v4-alva-trace.js v4-alva-license.html dist/
          cp v4-stella-test.html v4-stella-worker.js dist/
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 34
          mkdir -p dist/vendor
          # Exact, unmodified upstream GPLv3 AlvaAR release pinned to commit and Git Blob SHA.
          curl --fail --location --silent --show-error --retry 3 \
            https://raw.githubusercontent.com/alanross/AlvaAR/7796af500ee92001ac2a9888363ff64d7a3bee75/dist/alva_ar.js \
            -o dist/vendor/alva_ar.js
          curl --fail --location --silent --show-error --retry 3 \
            https://raw.githubusercontent.com/alanross/AlvaAR/7796af500ee92001ac2a9888363ff64d7a3bee75/LICENSE \
            -o dist/vendor/ALVAAR-LICENSE
          test "$(wc -c < dist/vendor/alva_ar.js)" -eq 4330870
          test "$(git hash-object dist/vendor/alva_ar.js)" = a04e5efb39752c8dd746ab051b5186455893abe1
          test "$(git hash-object dist/vendor/ALVAAR-LICENSE)" = f288702d2fa16d3cdf0035b15a9fcbc552cd88e7
          # This release does not modify, compile or relink the upstream runtime.
          grep -q 'export { AlvaAR }' dist/vendor/alva_ar.js
          ! grep -R 'web-vio-demo\|vin-vo-path\|vin-scan' dist/
      - name: Include only CI-validated genuine Stella browser JS/WASM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            run_id=$(jq -r '.workflow_run.id' "$GITHUB_EVENT_PATH")
          else
            run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/v4-stella-wasm-probe.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')
          fi
          if [ -z "$run_id" ]; then
            echo 'No successful Stella browser binary available'
            echo 'STELLA_VALIDATED_RUN=' >> "$GITHUB_ENV"
            echo 'STELLA_VALIDATED_SHA=' >> "$GITHUB_ENV"
            exit 0
          fi
          source_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.head_sha')
          echo "STELLA_VALIDATED_RUN=$run_id" >> "$GITHUB_ENV"
          echo "STELLA_VALIDATED_SHA=$source_sha" >> "$GITHUB_ENV"
          mkdir -p dist/vendor/stella
          if gh run download "$run_id" -R "$GITHUB_REPOSITORY" -n stella-browser-abi-js-wasm -D dist/vendor/stella; then
            test -s dist/vendor/stella/pai_stella_browser.js
            test -s dist/vendor/stella/pai_stella_browser.wasm
            echo "Published genuine Stella JS/WASM artifact from validated CI run $run_id" >> "$GITHUB_STEP_SUMMARY"
          else
            rm -rf dist/vendor/stella
            echo 'STELLA_VALIDATED_RUN=' >> "$GITHUB_ENV"
            echo 'STELLA_VALIDATED_SHA=' >> "$GITHUB_ENV"
            echo "Stella binary absent in run $run_id; not publishing placeholder" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Write deployed frontend and Stella WASM version metadata
        run: |
          set -euo pipefail
          export APP_COMMIT="$(git rev-parse HEAD)"
          python3 - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path
          path=Path("dist/vendor/stella/pai_stella_browser.wasm")
          wasm_available=path.is_file() and path.stat().st_size>0
          data={
            "schema":"pai-vin-stella-build-v1",
            "appVersion":"V1.2",
            "appCommit":os.environ["APP_COMMIT"],
            "builtAt":datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
            "stellaWasmRunId":os.environ.get("STELLA_VALIDATED_RUN","") if wasm_available else "",
            "stellaSourceCommit":os.environ.get("STELLA_VALIDATED_SHA","") if wasm_available else "",
            "wasmArtifactPresent":wasm_available
          }
          Path("dist/stella-build-info.json").write_text(json.dumps(data,ensure_ascii=False,indent=2)+chr(10))
          print(data)
          PY
          python3 -m json.tool dist/stella-build-info.json > /dev/null
          grep -q '"appVersion": "V1.2"' dist/stella-build-info.json
          echo "Stella version JSON valid and V1.2 embedded" >> "$GITHUB_STEP_SUMMARY"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload clean PWA
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
