name: COLMAP environment smoke test
on:
  push:
    paths:
      - "tools/run_colmap_baseline.py"
      - ".github/workflows/colmap-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  colmap-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install COLMAP and FFmpeg (CPU runner)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends colmap ffmpeg
      - name: Verify installed commands and syntax
        run: |
          command -v colmap
          command -v ffmpeg
          command -v ffprobe
          python3 -m py_compile tools/run_colmap_baseline.py
          python3 tests/test_colmap_parser.py
          colmap -h > colmap-help.txt
          ffmpeg -version | head -n 1
          grep -E "feature_extractor|mapper|image_registrator" colmap-help.txt
          colmap feature_extractor -h > feature-extractor-help.txt 2>&1 || true
          colmap sequential_matcher -h > sequential-matcher-help.txt 2>&1 || true
          colmap exhaustive_matcher -h > exhaustive-matcher-help.txt 2>&1 || true
          colmap mapper -h > mapper-help.txt 2>&1 || true
          colmap model_converter -h > model-converter-help.txt 2>&1 || true
          colmap image_registrator -h > image-registrator-help.txt 2>&1 || true
          grep -q -- '--ImageReader.single_camera' feature-extractor-help.txt
          grep -q -- '--SiftExtraction.use_gpu' feature-extractor-help.txt
          grep -q -- '--SiftMatching.use_gpu' exhaustive-matcher-help.txt
          grep -q -- '--database_path' image-registrator-help.txt
          grep -q -- '--output_type' model-converter-help.txt
      - name: Save COLMAP command capabilities
        uses: actions/upload-artifact@v4
        with:
          name: colmap-smoke-help
          path: |
            colmap-help.txt
            *-help.txt
