name: PAI-VIN Stella WASM feasibility probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v4-stella-wasm-probe.yml'
      - 'tools/v4-stella/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stella-wasm-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.74'
      - name: Toolchain smoke (real wasm executable)
        run: |
          set -euxo pipefail
          emcc --version | head -n 2
          emcc tools/v4-stella/wasm-smoke.c -O2 -sWASM=1 -sENVIRONMENT=node -o /tmp/v4-wasm-smoke.js
          node /tmp/v4-wasm-smoke.js | tee /tmp/v4-smoke-output.txt
          grep -Fx 'PAI-VIN WASM toolchain smoke OK' /tmp/v4-smoke-output.txt
          file /tmp/v4-wasm-smoke.wasm
      - name: Fetch pinned upstream stella_vslam
        run: |
          set -euxo pipefail
          mkdir -p /tmp/stella-vslam
          cd /tmp/stella-vslam
          git init
          git remote add origin https://github.com/stella-cv/stella_vslam.git
          git fetch --depth 1 origin e445b5452535e781fdf6777ec33a06f5f8f5e416
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = e445b5452535e781fdf6777ec33a06f5f8f5e416
          printf '%s\n' 'UPSTREAM_SHA=e445b5452535e781fdf6777ec33a06f5f8f5e416' > /tmp/stella-upstream.txt
      - name: Actual Emscripten CMake configure probe
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p probe-results
          set +e
          timeout 120s emcmake cmake -S /tmp/stella-vslam -B /tmp/stella-vslam/build-wasm \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTS=OFF -DUSE_ARUCO=OFF -DUSE_CCACHE=OFF \
            -DCMAKE_BUILD_TYPE=Release > probe-results/stella-emcmake-configure.log 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > probe-results/configure-exit-code.txt
          printf '%s\n' '--- configure log tail ---'
          tail -n 75 probe-results/stella-emcmake-configure.log
          if [ "$code" -eq 0 ]; then
            echo 'CMake configure SUCCESS (full SLAM wasm build still NOT verified)' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "CMake configure BLOCKED (exit code $code); no SLAM wasm build performed" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Upstream SHA e445b5452535e781fdf6777ec33a06f5f8f5e416" >> "$GITHUB_STEP_SUMMARY"
          echo 'Toolchain smoke compiled and executed successfully; this does not verify stella itself.' >> "$GITHUB_STEP_SUMMARY"
      - name: Second configure probe - relax OpenMP only in temporary upstream clone
        shell: bash
        run: |
          set -uo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/stella-vslam/CMakeLists.txt')
          s=p.read_text()
          old='find_package(OpenMP REQUIRED)'
          assert s.count(old)==1
          p.write_text(s.replace(old,'find_package(OpenMP QUIET)'))
          print('Changed ONLY the OpenMP REQUIRED check to QUIET in /tmp clone')
          PY
          set +e
          timeout 120s emcmake cmake -S /tmp/stella-vslam -B /tmp/stella-vslam/build-wasm-nonopenmp \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTS=OFF -DUSE_ARUCO=OFF -DUSE_CCACHE=OFF \
            -DCMAKE_BUILD_TYPE=Release > probe-results/stella-relaxed-openmp-configure.log 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > probe-results/relaxed-openmp-exit-code.txt
          echo "Relaxed OpenMP (temporary CI source): CMake configure exit $code" >> "$GITHUB_STEP_SUMMARY"
          tail -n 65 probe-results/stella-relaxed-openmp-configure.log
          if [ "$code" -eq 0 ]; then
            echo 'CMake configure passed, but compile/link and Safari runtime untested.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Subsequent dependency blocker found; see artifact log.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Third configure probe - Eigen3 header-only with Emscripten
        shell: bash
        run: |
          set -uo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeigen3-dev
          test -f /usr/include/eigen3/Eigen/src/Core/util/Macros.h
          printf '%s\n' 'Eigen3 header-only cross compile smoke:' > probe-results/eigen-wasm-smoke.log
          cat > /tmp/pai-eigen-smoke.cpp <<'CPP'
          #include <Eigen/Dense>
          #include <iostream>
          int main(){Eigen::Vector3f a(1,2,3);std::cout<<"EIGEN_WASM_OK "<<a.squaredNorm()<<std::endl;}
          CPP
          em++ /tmp/pai-eigen-smoke.cpp -std=c++17 -O2 -I/usr/include/eigen3 -sENVIRONMENT=node -o /tmp/pai-eigen-smoke.js >> probe-results/eigen-wasm-smoke.log 2>&1
          node /tmp/pai-eigen-smoke.js | tee -a probe-results/eigen-wasm-smoke.log
          grep -q 'EIGEN_WASM_OK 14' probe-results/eigen-wasm-smoke.log
          set +e
          timeout 120s emcmake cmake -S /tmp/stella-vslam -B /tmp/stella-vslam/build-wasm-eigen \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTS=OFF -DUSE_ARUCO=OFF -DUSE_CCACHE=OFF \
            -DEIGEN3_INCLUDE_DIR=/usr/include/eigen3 \
            -DCMAKE_BUILD_TYPE=Release > probe-results/stella-eigen-configure.log 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > probe-results/eigen-configure-exit-code.txt
          echo "Eigen3 WASM smoke passed; relaxed-OpenMP + Eigen stella configure exit $code" >> "$GITHUB_STEP_SUMMARY"
          tail -n 70 probe-results/stella-eigen-configure.log
          if [ "$code" -eq 0 ]; then
            echo 'Configure succeeded; actual stella compilation and Safari execution still untested.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Next dependency blocker found; see evidence artifact.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Fourth configure probe - build real yaml-cpp for WASM
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/yaml-cpp-src
          git clone --depth 1 --branch 0.8.0 https://github.com/jbeder/yaml-cpp.git /tmp/yaml-cpp-src
          emcmake cmake -S /tmp/yaml-cpp-src -B /tmp/yaml-cpp-build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DYAML_CPP_BUILD_TESTS=OFF -DYAML_CPP_BUILD_TOOLS=OFF \
            -DCMAKE_INSTALL_PREFIX=/tmp/pai-wasm-prefix > probe-results/yaml-wasm-build.log 2>&1
          emmake cmake --build /tmp/yaml-cpp-build -j2 >> probe-results/yaml-wasm-build.log 2>&1
          emmake cmake --install /tmp/yaml-cpp-build >> probe-results/yaml-wasm-build.log 2>&1
          test -f /tmp/pai-wasm-prefix/lib/libyaml-cpp.a
          test -f /tmp/pai-wasm-prefix/lib/cmake/yaml-cpp/yaml-cpp-config.cmake
          find /tmp/pai-wasm-prefix -maxdepth 5 -name '*yaml*cmake' -print >> probe-results/yaml-wasm-build.log
          echo 'yaml-cpp 0.8.0 static library WASM compilation PASS' >> "$GITHUB_STEP_SUMMARY"
          set +e
          timeout 120s emcmake cmake -S /tmp/stella-vslam -B /tmp/stella-vslam/build-wasm-yaml \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTS=OFF -DUSE_ARUCO=OFF -DUSE_CCACHE=OFF \
            -DEIGEN3_INCLUDE_DIR=/usr/include/eigen3 -DCMAKE_PREFIX_PATH=/tmp/pai-wasm-prefix \
            -Dyaml-cpp_DIR=/tmp/pai-wasm-prefix/lib/cmake/yaml-cpp \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DCMAKE_BUILD_TYPE=Release > probe-results/stella-yaml-configure.log 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > probe-results/yaml-configure-exit-code.txt
          echo "With OpenMP relaxed, Eigen and WASM yaml-cpp: stella configure exit $code" >> "$GITHUB_STEP_SUMMARY"
          tail -n 70 probe-results/stella-yaml-configure.log
          if [ "$code" -eq 0 ]; then
            echo 'Configuration passed. SLAM compile/link and Safari execution remain UNTESTED.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Next dependency blocker follows; see artifact log.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Fifth probe - cross-compile minimal OpenCV 4.8.1 for WASM
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p probe-results
          echo 'Attempting a REAL OpenCV Emscripten static build. No host OpenCV libraries are used.' >> "$GITHUB_STEP_SUMMARY"
          git clone --depth 1 --branch 4.8.1 https://github.com/opencv/opencv.git /tmp/pai-opencv-src
          test "$(git -C /tmp/pai-opencv-src rev-parse HEAD)" = 5199850039ad23f1f0e6cccea5061a9fea5efca6
          set +e
          timeout 180s emcmake cmake -S /tmp/pai-opencv-src -B /tmp/pai-opencv-build \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/tmp/pai-wasm-prefix \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_LIST=core,imgproc,imgcodecs,features2d,calib3d,videoio,highgui \
            -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF -DBUILD_EXAMPLES=OFF \
            -DBUILD_opencv_apps=OFF -DBUILD_JAVA=OFF -DBUILD_opencv_python2=OFF -DBUILD_opencv_python3=OFF \
            -DWITH_OPENMP=OFF -DWITH_PTHREADS_PF=OFF -DWITH_TBB=OFF -DWITH_IPP=OFF -DWITH_ITT=OFF \
            -DWITH_FFMPEG=OFF -DWITH_GSTREAMER=OFF -DWITH_GTK=OFF -DWITH_QT=OFF \
            -DWITH_OPENEXR=OFF -DWITH_JPEG=OFF -DWITH_PNG=OFF -DWITH_TIFF=OFF -DWITH_WEBP=OFF \
            -DWITH_1394=OFF -DWITH_V4L=OFF -DWITH_OPENCL=OFF \
            > probe-results/opencv-wasm-configure.log 2>&1
          cfg_code=$?
          echo "$cfg_code" > probe-results/opencv-configure-exit-code.txt
          if [ "$cfg_code" -ne 0 ]; then
            echo "OpenCV WASM configure BLOCKED (code $cfg_code)" >> "$GITHUB_STEP_SUMMARY"
            tail -n 70 probe-results/opencv-wasm-configure.log
          else
            echo 'OpenCV WASM configure PASS; attempting source build' >> "$GITHUB_STEP_SUMMARY"
            timeout 480s emmake cmake --build /tmp/pai-opencv-build -j2 \
              > probe-results/opencv-wasm-build.log 2>&1
            build_code=$?
            echo "$build_code" > probe-results/opencv-build-exit-code.txt
            if [ "$build_code" -eq 0 ]; then
              emmake cmake --install /tmp/pai-opencv-build >> probe-results/opencv-wasm-build.log 2>&1
              build_code=$?
            fi
            if [ "$build_code" -eq 0 ]; then
              echo 'OpenCV WASM static library build PASS; attempting stella configure' >> "$GITHUB_STEP_SUMMARY"
              timeout 150s emcmake cmake -S /tmp/stella-vslam -B /tmp/stella-vslam/build-wasm-opencv \
                -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTS=OFF -DUSE_ARUCO=OFF -DUSE_CCACHE=OFF \
                -DEIGEN3_INCLUDE_DIR=/usr/include/eigen3 \
                -DCMAKE_PREFIX_PATH=/tmp/pai-wasm-prefix \
                -Dyaml-cpp_DIR=/tmp/pai-wasm-prefix/lib/cmake/yaml-cpp \
                -DOpenCV_DIR=/tmp/pai-wasm-prefix/lib/cmake/opencv4 \
                -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH -DCMAKE_BUILD_TYPE=Release \
                > probe-results/stella-opencv-configure.log 2>&1
              stella_code=$?
              echo "$stella_code" > probe-results/stella-opencv-configure-exit-code.txt
              echo "With WASM OpenCV: stella CMake configure exit $stella_code (NOT a complete SLAM build)" >> "$GITHUB_STEP_SUMMARY"
              tail -n 55 probe-results/stella-opencv-configure.log
            else
              echo "OpenCV WASM compile BLOCKED (code $build_code)" >> "$GITHUB_STEP_SUMMARY"
              echo '--- FIRST compiler/link errors ---'
              grep -n -m 20 -E 'error:|fatal error:|undefined symbol|No rule to make|gmake:.*Error' probe-results/opencv-wasm-build.log | tee probe-results/opencv-first-errors.txt || true
              echo '--- build log tail ---'
              tail -n 55 probe-results/opencv-wasm-build.log
            fi
          fi
          set -e
      - name: Save configure evidence (including blockers)
        uses: actions/upload-artifact@v4
        with:
          name: stella-v4-wasm-feasibility
          path: probe-results/
          retention-days: 14
