name: PAI-VIN Stella WASM feasibility probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v4-stella-wasm-probe.yml'
      - 'tools/v4-stella/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stella-wasm-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.74'
      - name: Restore pinned OpenCV WASM install prefix cache
        id: opencv-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/pai-wasm-prefix
          key: pai-vin-opencv481-emsdk3174-static-nointrinsics-v1
      - name: Toolchain smoke (real wasm executable)
        run: |
          set -euxo pipefail
          emcc --version | head -n 2
          emcc tools/v4-stella/wasm-smoke.c -O2 -sWASM=1 -sENVIRONMENT=node -o /tmp/v4-wasm-smoke.js
          node /tmp/v4-wasm-smoke.js | tee /tmp/v4-smoke-output.txt
          grep -Fx 'PAI-VIN WASM toolchain smoke OK' /tmp/v4-smoke-output.txt
          file /tmp/v4-wasm-smoke.wasm
      - name: Fetch pinned upstream stella_vslam
        run: |
          set -euxo pipefail
          mkdir -p /tmp/stella-vslam
          cd /tmp/stella-vslam
          git init
          git remote add origin https://github.com/stella-cv/stella_vslam.git
          git fetch --depth 1 origin e445b5452535e781fdf6777ec33a06f5f8f5e416
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = e445b5452535e781fdf6777ec33a06f5f8f5e416
          git submodule update --init --recursive --depth 1
          test -f 3rd/FBoW/CMakeLists.txt
          test -d 3rd/tinycolormap/include
          printf '%s\n' 'UPSTREAM_SHA=e445b5452535e781fdf6777ec33a06f5f8f5e416' > /tmp/stella-upstream.txt
      - name: Actual Emscripten CMake configure probe
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p probe-results
          set +e
          timeout 120s emcmake cmake -S /tmp/stella-vslam -B /tmp/stella-vslam/build-wasm \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTS=OFF -DUSE_ARUCO=OFF -DUSE_CCACHE=OFF \
            -DCMAKE_BUILD_TYPE=Release > probe-results/stella-emcmake-configure.log 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > probe-results/configure-exit-code.txt
          printf '%s\n' '--- configure log tail ---'
          tail -n 75 probe-results/stella-emcmake-configure.log
          if [ "$code" -eq 0 ]; then
            echo 'CMake configure SUCCESS (full SLAM wasm build still NOT verified)' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "CMake configure BLOCKED (exit code $code); no SLAM wasm build performed" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Upstream SHA e445b5452535e781fdf6777ec33a06f5f8f5e416" >> "$GITHUB_STEP_SUMMARY"
          echo 'Toolchain smoke compiled and executed successfully; this does not verify stella itself.' >> "$GITHUB_STEP_SUMMARY"
      - name: Second configure probe - relax OpenMP only in temporary upstream clone
        shell: bash
        run: |
          set -uo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/stella-vslam/CMakeLists.txt')
          s=p.read_text()
          old='find_package(OpenMP REQUIRED)'
          assert s.count(old)==1
          p.write_text(s.replace(old,'find_package(OpenMP QUIET)'))
          print('Changed ONLY the OpenMP REQUIRED check to QUIET in /tmp clone')
          PY
          set +e
          timeout 120s emcmake cmake -S /tmp/stella-vslam -B /tmp/stella-vslam/build-wasm-nonopenmp \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTS=OFF -DUSE_ARUCO=OFF -DUSE_CCACHE=OFF \
            -DCMAKE_BUILD_TYPE=Release > probe-results/stella-relaxed-openmp-configure.log 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > probe-results/relaxed-openmp-exit-code.txt
          echo "Relaxed OpenMP (temporary CI source): CMake configure exit $code" >> "$GITHUB_STEP_SUMMARY"
          tail -n 65 probe-results/stella-relaxed-openmp-configure.log
          if [ "$code" -eq 0 ]; then
            echo 'CMake configure passed, but compile/link and Safari runtime untested.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Subsequent dependency blocker found; see artifact log.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Third configure probe - Eigen3 header-only with Emscripten
        shell: bash
        run: |
          set -uo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeigen3-dev
          test -f /usr/include/eigen3/Eigen/src/Core/util/Macros.h
          printf '%s\n' 'Eigen3 header-only cross compile smoke:' > probe-results/eigen-wasm-smoke.log
          cat > /tmp/pai-eigen-smoke.cpp <<'CPP'
          #include <Eigen/Dense>
          #include <iostream>
          int main(){Eigen::Vector3f a(1,2,3);std::cout<<"EIGEN_WASM_OK "<<a.squaredNorm()<<std::endl;}
          CPP
          em++ /tmp/pai-eigen-smoke.cpp -std=c++17 -O2 -I/usr/include/eigen3 -sENVIRONMENT=node -o /tmp/pai-eigen-smoke.js >> probe-results/eigen-wasm-smoke.log 2>&1
          node /tmp/pai-eigen-smoke.js | tee -a probe-results/eigen-wasm-smoke.log
          grep -q 'EIGEN_WASM_OK 14' probe-results/eigen-wasm-smoke.log
          set +e
          timeout 120s emcmake cmake -S /tmp/stella-vslam -B /tmp/stella-vslam/build-wasm-eigen \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTS=OFF -DUSE_ARUCO=OFF -DUSE_CCACHE=OFF \
            -DEIGEN3_INCLUDE_DIR=/usr/include/eigen3 \
            -DCMAKE_BUILD_TYPE=Release > probe-results/stella-eigen-configure.log 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > probe-results/eigen-configure-exit-code.txt
          echo "Eigen3 WASM smoke passed; relaxed-OpenMP + Eigen stella configure exit $code" >> "$GITHUB_STEP_SUMMARY"
          tail -n 70 probe-results/stella-eigen-configure.log
          if [ "$code" -eq 0 ]; then
            echo 'Configure succeeded; actual stella compilation and Safari execution still untested.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Next dependency blocker found; see evidence artifact.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Fourth configure probe - build real yaml-cpp for WASM
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/yaml-cpp-src
          git clone --depth 1 --branch 0.8.0 https://github.com/jbeder/yaml-cpp.git /tmp/yaml-cpp-src
          emcmake cmake -S /tmp/yaml-cpp-src -B /tmp/yaml-cpp-build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DYAML_CPP_BUILD_TESTS=OFF -DYAML_CPP_BUILD_TOOLS=OFF \
            -DCMAKE_INSTALL_PREFIX=/tmp/pai-wasm-prefix > probe-results/yaml-wasm-build.log 2>&1
          emmake cmake --build /tmp/yaml-cpp-build -j2 >> probe-results/yaml-wasm-build.log 2>&1
          emmake cmake --install /tmp/yaml-cpp-build >> probe-results/yaml-wasm-build.log 2>&1
          test -f /tmp/pai-wasm-prefix/lib/libyaml-cpp.a
          test -f /tmp/pai-wasm-prefix/lib/cmake/yaml-cpp/yaml-cpp-config.cmake
          find /tmp/pai-wasm-prefix -maxdepth 5 -name '*yaml*cmake' -print >> probe-results/yaml-wasm-build.log
          echo 'yaml-cpp 0.8.0 static library WASM compilation PASS' >> "$GITHUB_STEP_SUMMARY"
          set +e
          timeout 120s emcmake cmake -S /tmp/stella-vslam -B /tmp/stella-vslam/build-wasm-yaml \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTS=OFF -DUSE_ARUCO=OFF -DUSE_CCACHE=OFF \
            -DEIGEN3_INCLUDE_DIR=/usr/include/eigen3 -DCMAKE_PREFIX_PATH=/tmp/pai-wasm-prefix \
            -Dyaml-cpp_DIR=/tmp/pai-wasm-prefix/lib/cmake/yaml-cpp \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DCMAKE_BUILD_TYPE=Release > probe-results/stella-yaml-configure.log 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > probe-results/yaml-configure-exit-code.txt
          echo "With OpenMP relaxed, Eigen and WASM yaml-cpp: stella configure exit $code" >> "$GITHUB_STEP_SUMMARY"
          tail -n 70 probe-results/stella-yaml-configure.log
          if [ "$code" -eq 0 ]; then
            echo 'Configuration passed. SLAM compile/link and Safari execution remain UNTESTED.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Next dependency blocker follows; see artifact log.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Fifth probe - cross-compile minimal OpenCV 4.8.1 for WASM
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p probe-results
          echo 'Attempting REAL OpenCV Emscripten static build with intrinsic SIMD disabled after confirmed intrin_wasm.hpp API errors. No host OpenCV libraries used.' >> "$GITHUB_STEP_SUMMARY"
          git clone --depth 1 --branch 4.8.1 https://github.com/opencv/opencv.git /tmp/pai-opencv-src
          test "$(git -C /tmp/pai-opencv-src rev-parse HEAD)" = 5199850039ad23f1f0e6cccea5061a9fea5efca6
          set +e
          timeout 180s emcmake cmake -S /tmp/pai-opencv-src -B /tmp/pai-opencv-build \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/tmp/pai-wasm-prefix \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_LIST=core,imgproc,imgcodecs,features2d,calib3d,videoio,highgui \
            -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF -DBUILD_EXAMPLES=OFF \
            -DBUILD_opencv_apps=OFF -DBUILD_JAVA=OFF -DBUILD_opencv_python2=OFF -DBUILD_opencv_python3=OFF \
            -DWITH_OPENMP=OFF -DWITH_PTHREADS_PF=OFF -DWITH_TBB=OFF -DWITH_IPP=OFF -DWITH_ITT=OFF \
            -DWITH_FFMPEG=OFF -DWITH_GSTREAMER=OFF -DWITH_GTK=OFF -DWITH_QT=OFF \
            -DWITH_OPENEXR=OFF -DWITH_JPEG=OFF -DWITH_PNG=OFF -DWITH_TIFF=OFF -DWITH_WEBP=OFF \
            -DWITH_1394=OFF -DWITH_V4L=OFF -DWITH_OPENCL=OFF \
            -DWITH_PROTOBUF=OFF -DBUILD_PROTOBUF=OFF -DBUILD_opencv_dnn=OFF -DWITH_QUIRC=OFF -DBUILD_opencv_gapi=OFF -DWITH_ADE=OFF \
            -DCV_ENABLE_INTRINSICS=OFF -DCV_DISABLE_OPTIMIZATION=ON \
            '-DCPU_BASELINE=' '-DCPU_DISPATCH=' \
            > probe-results/opencv-wasm-configure.log 2>&1
          cfg_code=$?
          echo "$cfg_code" > probe-results/opencv-configure-exit-code.txt
          if [ "$cfg_code" -ne 0 ]; then
            echo "OpenCV WASM configure BLOCKED (code $cfg_code)" >> "$GITHUB_STEP_SUMMARY"
            tail -n 70 probe-results/opencv-wasm-configure.log
          else
            echo 'OpenCV WASM configure PASS; attempting source build' >> "$GITHUB_STEP_SUMMARY"
            timeout 480s emmake cmake --build /tmp/pai-opencv-build -j2 \
              > probe-results/opencv-wasm-build.log 2>&1
            build_code=$?
            echo "$build_code" > probe-results/opencv-build-exit-code.txt
            if [ "$build_code" -eq 0 ]; then
              emmake cmake --install /tmp/pai-opencv-build >> probe-results/opencv-wasm-build.log 2>&1
              build_code=$?
            fi
            if [ "$build_code" -eq 0 ]; then
              echo 'OpenCV WASM static library build PASS; attempting stella configure' >> "$GITHUB_STEP_SUMMARY"
              python3 tools/v4-stella/check_opencv_exports.py /tmp/pai-wasm-prefix probe-results/opencv-missing-exported-archives.txt
              timeout 150s emcmake cmake -S /tmp/stella-vslam -B /tmp/stella-vslam/build-wasm-opencv \
                -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTS=OFF -DUSE_ARUCO=OFF -DUSE_CCACHE=OFF \
                -DEIGEN3_INCLUDE_DIR=/usr/include/eigen3 \
                -DCMAKE_PREFIX_PATH=/tmp/pai-wasm-prefix \
                -Dyaml-cpp_DIR=/tmp/pai-wasm-prefix/lib/cmake/yaml-cpp \
                -DOpenCV_DIR=/tmp/pai-wasm-prefix/lib/cmake/opencv4 \
                -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH -DCMAKE_BUILD_TYPE=Release \
                > probe-results/stella-opencv-configure.log 2>&1
              stella_code=$?
              echo "$stella_code" > probe-results/stella-opencv-configure-exit-code.txt
              echo "With WASM OpenCV: stella CMake configure exit $stella_code (NOT a complete SLAM build)" >> "$GITHUB_STEP_SUMMARY"
              tail -n 55 probe-results/stella-opencv-configure.log
            else
              echo "OpenCV WASM compile BLOCKED (code $build_code)" >> "$GITHUB_STEP_SUMMARY"
              echo '--- FIRST compiler/link errors ---'
              grep -n -m 20 -E 'error:|fatal error:|undefined symbol|No rule to make|gmake:.*Error' probe-results/opencv-wasm-build.log | tee probe-results/opencv-first-errors.txt || true
              echo '--- build log tail ---'
              tail -n 55 probe-results/opencv-wasm-build.log
            fi
          fi
          set -e
      - name: Verify newly built OpenCV WASM archives before caching
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          test "$(cat probe-results/opencv-configure-exit-code.txt)" = "0"
          test "$(cat probe-results/opencv-build-exit-code.txt)" = "0"
          test -f /tmp/pai-wasm-prefix/lib/cmake/opencv4/OpenCVConfig.cmake
          test -s /tmp/pai-wasm-prefix/lib/libopencv_core.a
          test -s /tmp/pai-wasm-prefix/lib/libopencv_features2d.a
          echo "OpenCV WASM real archives confirmed; safe to cache installed prefix" >> "$GITHUB_STEP_SUMMARY"
      - name: Cache verified WASM OpenCV install prefix
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/pai-wasm-prefix
          key: pai-vin-opencv481-emsdk3174-static-nointrinsics-v1
      - name: Verify restored WASM OpenCV cache
        if: steps.opencv-cache.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          test -f /tmp/pai-wasm-prefix/lib/cmake/opencv4/OpenCVConfig.cmake
          test -s /tmp/pai-wasm-prefix/lib/libopencv_core.a
          test -s /tmp/pai-wasm-prefix/lib/libopencv_features2d.a
          echo "Reused verified OpenCV 4.8.1 WASM libraries from Actions cache" >> "$GITHUB_STEP_SUMMARY"
      - name: Sixth probe - actual SQLite3 WASM static build and stella configure
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/pai-wasm-prefix/lib/cmake/opencv4/OpenCVConfig.cmake
          curl -fsSL --retry 3 https://www.sqlite.org/2024/sqlite-amalgamation-3460100.zip -o /tmp/pai-sqlite.zip
          mkdir -p /tmp/pai-sqlite-src
          unzip -q /tmp/pai-sqlite.zip -d /tmp/pai-sqlite-src
          SQLITE_SRC=/tmp/pai-sqlite-src/sqlite-amalgamation-3460100
          test -s "$SQLITE_SRC/sqlite3.c"
          mkdir -p /tmp/pai-wasm-prefix/include /tmp/pai-wasm-prefix/lib
          emcc -O2 -DSQLITE_THREADSAFE=0 -DSQLITE_OMIT_LOAD_EXTENSION -c "$SQLITE_SRC/sqlite3.c" -o /tmp/pai-sqlite3.o > probe-results/sqlite-wasm-build.log 2>&1
          emar rcs /tmp/pai-wasm-prefix/lib/libsqlite3.a /tmp/pai-sqlite3.o
          cp "$SQLITE_SRC/sqlite3.h" /tmp/pai-wasm-prefix/include/sqlite3.h
          cat > /tmp/pai-sqlite-smoke.c <<'EOF'
          #include "sqlite3.h"
          #include <stdio.h>
          int main(void){sqlite3 *db=0;int rc=sqlite3_open(":memory:",&db);if(rc) return rc;puts("SQLITE_WASM_OK");sqlite3_close(db);return 0;}
          EOF
          emcc /tmp/pai-sqlite-smoke.c -O2 -I/tmp/pai-wasm-prefix/include /tmp/pai-wasm-prefix/lib/libsqlite3.a -sENVIRONMENT=node -o /tmp/pai-sqlite-smoke.js >> probe-results/sqlite-wasm-build.log 2>&1
          node /tmp/pai-sqlite-smoke.js | tee -a probe-results/sqlite-wasm-build.log
          grep -q SQLITE_WASM_OK probe-results/sqlite-wasm-build.log
          echo 'SQLite3 3.46.1 WASM archive linked and executed successfully' >> "$GITHUB_STEP_SUMMARY"
          set +e
          timeout 150s emcmake cmake -S /tmp/stella-vslam -B /tmp/stella-vslam/build-wasm-sqlite \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTS=OFF -DUSE_ARUCO=OFF -DUSE_CCACHE=OFF \
            -DEIGEN3_INCLUDE_DIR=/usr/include/eigen3 \
            -DCMAKE_PREFIX_PATH=/tmp/pai-wasm-prefix \
            -Dyaml-cpp_DIR=/tmp/pai-wasm-prefix/lib/cmake/yaml-cpp \
            -DOpenCV_DIR=/tmp/pai-wasm-prefix/lib/cmake/opencv4 \
            -DSQLite3_INCLUDE_DIR=/tmp/pai-wasm-prefix/include \
            -DSQLite3_LIBRARY=/tmp/pai-wasm-prefix/lib/libsqlite3.a \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH -DCMAKE_BUILD_TYPE=Release \
            > probe-results/stella-sqlite-configure.log 2>&1
          rc=$?
          set -e
          echo "$rc" > probe-results/sqlite-configure-exit-code.txt
          echo "With WASM SQLite3: stella CMake configure exit $rc (NOT full SLAM compile)" >> "$GITHUB_STEP_SUMMARY"
          tail -n 70 probe-results/stella-sqlite-configure.log
      - name: Seventh probe - install pinned g2o WASM and check stella's full solver dependency
        shell: bash
        run: |
          set -uo pipefail
          git clone --quiet https://github.com/RainerKuemmerle/g2o.git /tmp/pai-g2o-src
          git -C /tmp/pai-g2o-src checkout --detach fd65627348213d56866b24c0b7d054bcf105f0a5
          test "$(git -C /tmp/pai-g2o-src rev-parse HEAD)" = fd65627348213d56866b24c0b7d054bcf105f0a5
          set +e
          timeout 150s emcmake cmake -S /tmp/pai-g2o-src -B /tmp/pai-g2o-wasm \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/tmp/pai-wasm-prefix \
            -DBUILD_SHARED_LIBS=OFF -DG2O_BUILD_APPS=OFF -DG2O_BUILD_EXAMPLES=OFF \
            -DBUILD_UNITTESTS=OFF -DG2O_BUILD_BENCHMARKS=OFF \
            -DG2O_USE_OPENGL=OFF -DG2O_USE_OPENMP=OFF -DG2O_USE_CHOLMOD=OFF \
            -DG2O_USE_CSPARSE=OFF -DG2O_USE_LGPL_LIBS=OFF \
            -DG2O_USE_LOGGING=OFF -DDO_SSE_AUTODETECT=OFF \
            -DEigen3_DIR=/usr/share/eigen3/cmake \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            > probe-results/g2o-wasm-configure.log 2>&1
          cfg=$?
          if [ "$cfg" -eq 0 ]; then
            timeout 360s emmake cmake --build /tmp/pai-g2o-wasm -j2 > probe-results/g2o-wasm-build.log 2>&1
            built=$?
          else
            built=98
          fi
          if [ "$built" -eq 0 ]; then
            emmake cmake --install /tmp/pai-g2o-wasm >> probe-results/g2o-wasm-build.log 2>&1
            built=$?
          fi
          printf '%s\n' "$cfg" > probe-results/g2o-configure-exit-code.txt
          printf '%s\n' "$built" > probe-results/g2o-build-exit-code.txt
          echo "g2o configure=$cfg build/install=$built (real WASM archives; CSparse disabled)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$built" -eq 0 ]; then
            find /tmp/pai-wasm-prefix -iname '*g2o*config*.cmake' > probe-results/g2o-config-paths.txt
            cat probe-results/g2o-config-paths.txt
            # Adapt only the temporary pinned upstream clone, never checked-in PWA sources.
            python3 tools/v4-stella/adapt_eigen_solver_wasm.py /tmp/stella-vslam
            python3 tools/v4-stella/adapt_fbow_cpu_wasm.py /tmp/stella-vslam/3rd/FBoW
            python3 tools/v4-stella/adapt_link_dependencies_wasm.py /tmp/stella-vslam /tmp/pai-wasm-prefix
            python3 -c 'from pathlib import Path; p=Path("/tmp/stella-vslam/src/stella_vslam/CMakeLists.txt"); s=p.read_text(); marker="find_package(g2o REQUIRED"; assert s.count(marker)==1; p.write_text(s.replace(marker,"find_package(Eigen3 CONFIG REQUIRED)\n"+marker,1))'
            # Add a genuine executable linking real stella_vslam and its transitive libraries.
            # Constructor-only smoke: no background threads, no fabricated camera poses.
            printf '%s\n' \
              "add_executable(pai_stella_link_smoke \"$GITHUB_WORKSPACE/tools/v4-stella/stella-wasm-link-smoke.cc\")" \
              'target_link_libraries(pai_stella_link_smoke PRIVATE stella_vslam)' \
              'set_target_properties(pai_stella_link_smoke PROPERTIES SUFFIX ".js")' \
              'target_link_options(pai_stella_link_smoke PRIVATE "-sALLOW_MEMORY_GROWTH=1" "-sENVIRONMENT=node" "-sEXIT_RUNTIME=0")' \
              >> /tmp/stella-vslam/CMakeLists.txt
            printf '%s\n' "include(\"$GITHUB_WORKSPACE/tools/v4-stella/stella-browser-target.cmake\")" >> /tmp/stella-vslam/CMakeLists.txt
            timeout 150s emcmake cmake -S /tmp/stella-vslam -B /tmp/stella-vslam/build-wasm-g2o \
              -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTS=OFF -DUSE_ARUCO=OFF -DUSE_CCACHE=OFF \
              -DEIGEN3_INCLUDE_DIR=/usr/include/eigen3 \
              -DEigen3_DIR=/usr/share/eigen3/cmake \
              -DCMAKE_PREFIX_PATH=/tmp/pai-wasm-prefix \
              -Dyaml-cpp_DIR=/tmp/pai-wasm-prefix/lib/cmake/yaml-cpp \
              -DOpenCV_DIR=/tmp/pai-wasm-prefix/lib/cmake/opencv4 \
              -DSQLite3_INCLUDE_DIR=/tmp/pai-wasm-prefix/include \
              -DSQLite3_LIBRARY=/tmp/pai-wasm-prefix/lib/libsqlite3.a \
              -DUSE_AVX=OFF -DUSE_MMX=OFF -DUSE_SSE=OFF -DUSE_SSE2=OFF -DUSE_SSE3=OFF -DUSE_SSE4=OFF \
              -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH -DCMAKE_BUILD_TYPE=Release \
              > probe-results/stella-g2o-configure.log 2>&1
            stella_rc=$?
            if [ "$stella_rc" -eq 0 ]; then
              if grep -E '^CMAKE_CXX_FLAGS(:|_)|^USE_(AVX|MMX|SSE|SSE2|SSE3|SSE4):' /tmp/stella-vslam/build-wasm-g2o/CMakeCache.txt > probe-results/fbow-simd-cmake-cache.txt; then
                cat probe-results/fbow-simd-cmake-cache.txt
              fi
              if grep -Eq '(^|[[:space:]])-m(mmx|avx|sse|sse2|sse3|sse4\.1)([[:space:]]|$)' /tmp/stella-vslam/build-wasm-g2o/3rd/FBoW/CMakeFiles/fbow.dir/flags.make; then
                echo 'ERROR: x86 SIMD flags remain in FBoW WASM compile flags' >> "$GITHUB_STEP_SUMMARY"
                stella_rc=91
              fi
            fi
            echo "$stella_rc" > probe-results/stella-g2o-configure-exit-code.txt
            echo "stella CMake using genuine g2o exports exit=$stella_rc; csparse targets NOT faked" >> "$GITHUB_STEP_SUMMARY"
            if [ "$stella_rc" -eq 0 ]; then
              echo "Stella CMake configure PASS; compiling real stella_vslam C++ WASM target" >> "$GITHUB_STEP_SUMMARY"
              timeout 480s emmake cmake --build /tmp/stella-vslam/build-wasm-g2o --target stella_vslam -j2 \
                > probe-results/stella-wasm-core-build.log 2>&1
              stella_build_rc=$?
              echo "$stella_build_rc" > probe-results/stella-build-exit-code.txt
              if [ "$stella_build_rc" -eq 0 ]; then
                find /tmp/stella-vslam/build-wasm-g2o -type f -name '*stella_vslam*.a' -print > probe-results/stella-core-archives.txt
                if [ ! -s probe-results/stella-core-archives.txt ]; then
                  stella_build_rc=90
                  echo "$stella_build_rc" > probe-results/stella-build-exit-code.txt
                  echo 'Stella target exit 0 but static archive NOT found' >> "$GITHUB_STEP_SUMMARY"
                else
                  echo 'Stella C++ WASM static archive compiled successfully (browser runtime still NOT tested)' >> "$GITHUB_STEP_SUMMARY"
                  cat probe-results/stella-core-archives.txt
                fi
              fi
              if [ "$stella_build_rc" -ne 0 ]; then
                echo "Stella C++ WASM compile FAILED exit=$stella_build_rc" >> "$GITHUB_STEP_SUMMARY"
                grep -n -m 20 -E 'error:|fatal error:|undefined symbol|Error' probe-results/stella-wasm-core-build.log || true
                tail -n 55 probe-results/stella-wasm-core-build.log
              fi
            else
              echo 'Stella C++ build SKIPPED because configure did not pass' >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ "${stella_build_rc:-99}" -eq 0 ]; then
              timeout 240s emmake cmake --build /tmp/stella-vslam/build-wasm-g2o --target pai_stella_link_smoke -j2 > probe-results/stella-wasm-link-build.log 2>&1
              link_rc=$?
              echo "$link_rc" > probe-results/stella-link-exit-code.txt
              if [ "$link_rc" -eq 0 ]; then
                timeout 30s node /tmp/stella-vslam/build-wasm-g2o/pai_stella_link_smoke.js > probe-results/stella-wasm-node-execute.log 2>&1
                execute_rc=$?
                if [ "$execute_rc" -eq 0 ] && grep -q 'PAI_STELLA_REAL_SYSTEM_CONSTRUCTOR_LINK_PASS' probe-results/stella-wasm-node-execute.log && grep -Eq 'PAI_STELLA_REAL_ORB_FRAME features=[1-9][0-9]* descriptor_rows=[1-9][0-9]*' probe-results/stella-wasm-node-execute.log; then
                  echo "0" > probe-results/stella-node-exit-code.txt
                  echo 'Real Stella system and actual monocular ORB extraction executed in Node WASM (Safari NOT tested)' >> "$GITHUB_STEP_SUMMARY"
                else
                  echo "${execute_rc:-96}" > probe-results/stella-node-exit-code.txt
                  tail -n 60 probe-results/stella-wasm-node-execute.log
                fi
              else
                echo "97" > probe-results/stella-node-exit-code.txt
                grep -n -m 25 -E 'error:|undefined symbol|Error' probe-results/stella-wasm-link-build.log || true
                tail -n 60 probe-results/stella-wasm-link-build.log
              fi
            fi
            grep -n -m 18 -E 'CMake Error|Could NOT find|NOT_FOUND|not found|[Ee]rror' probe-results/stella-g2o-configure.log || true
            tail -n 55 probe-results/stella-g2o-configure.log
          else
            grep -n -m 18 -E 'error:|fatal error:|undefined|[Ee]rror' probe-results/g2o-wasm-build.log probe-results/g2o-wasm-configure.log || true
            tail -n 45 probe-results/g2o-wasm-build.log 2>/dev/null || true
          fi
          set -e
      - name: Save configure evidence (including blockers)
        uses: actions/upload-artifact@v4
        with:
          name: stella-v4-wasm-feasibility
          path: probe-results/
          retention-days: 14
      - name: Enforce Stella core acceptance gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f probe-results/stella-g2o-configure-exit-code.txt || { echo "Stella configure was never reached"; exit 1; }
          test "$(cat probe-results/stella-g2o-configure-exit-code.txt)" = "0" || { echo "Stella configure did not pass"; exit 1; }
          test -f probe-results/stella-build-exit-code.txt || { echo "Stella source build was never reached"; exit 1; }
          test "$(cat probe-results/stella-build-exit-code.txt)" = "0" || { echo "Stella source build failed"; exit 1; }
          test -s probe-results/stella-core-archives.txt || { echo "Stella static archive missing"; exit 1; }
          echo "Stella genuine WASM C++ compilation acceptance PASS" >> "$GITHUB_STEP_SUMMARY"
          test -f probe-results/stella-link-exit-code.txt || { echo "JS/WASM link was not attempted"; exit 1; }
          test "$(cat probe-results/stella-link-exit-code.txt)" = "0" || { echo "JS/WASM link failed"; exit 1; }
          test "$(cat probe-results/stella-node-exit-code.txt)" = "0" || { echo "Node.js WASM execution did not pass"; exit 1; }
          echo "Stella ctor + actual monocular frame ORB processing PASS in Node; Safari / camera pose tracking NOT verified" >> "$GITHUB_STEP_SUMMARY"
