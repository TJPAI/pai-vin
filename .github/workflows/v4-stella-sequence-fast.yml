name: PAI-VIN Stella fast 25-frame + geometric-parallax WASM validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v4-stella-sequence-fast.yml'
      - 'tools/v4-stella/stella-bridge-node-smoke.cjs'
      - 'tools/v4-stella/stella-parallax-node-smoke.cjs'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real-stella-sequence:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify #77 real WASM artifact provenance (failure retained)
        run: |
          set -euo pipefail
          echo "SOURCE_RUN=41853550647" >> "$GITHUB_STEP_SUMMARY"
          # The source #77 failed because the strict sequence acceptance did
          # not run after zero native poses; its WASM artifact was built and
          # uploaded. Pin source SHA rather than incorrectly requiring green CI.
          source_sha=$(gh run view 41853550647 -R "$GITHUB_REPOSITORY" --json headSha --jq '.headSha')
          test "$source_sha" = "1553ab74bfb13a49b6f1a500ed6a413e90bdebfb"
          mkdir -p /tmp/stella-validated
          gh run download 41853550647 -R "$GITHUB_REPOSITORY" -n stella-browser-abi-js-wasm -D /tmp/stella-validated
          test -s /tmp/stella-validated/pai_stella_browser.js
          test -s /tmp/stella-validated/pai_stella_browser.wasm
          sha256sum /tmp/stella-validated/pai_stella_browser.js /tmp/stella-validated/pai_stella_browser.wasm | tee stella-validated-sha256.txt
      - name: Run actual Stella 25 frame no-deadlock proof
        run: |
          set -euo pipefail
          timeout 100s node tools/v4-stella/stella-bridge-node-smoke.cjs /tmp/stella-validated/pai_stella_browser.js | tee stella-25frame-test.log
          grep -q 'PAI_STELLA_BROWSER_ABI_MULTIFRAME_PASS frames=25' stella-25frame-test.log
          echo 'Real Stella WASM 25-frame sequence ran without deadlock (not a pose-accuracy test)' >> "$GITHUB_STEP_SUMMARY"
      - name: Run actual Stella 32 frame true geometric parallax fixture
        run: |
          set -euo pipefail
          : > stella-parallax-test.log
          for texture in 41 16 10; do
            for preset in baseline wide near; do
              echo "=== STELLA 3D parallax preset=$preset texture=$texture ===" | tee -a stella-parallax-test.log
              PAI_TEXTURE_SCALE="$texture" PAI_PARALLAX_PRESET="$preset" timeout 150s node tools/v4-stella/stella-parallax-node-smoke.cjs /tmp/stella-validated/pai_stella_browser.js | tee -a stella-parallax-test.log
            done
          done
          test "$(grep -c 'PAI_STELLA_GEOMETRIC_PARALLAX_MULTIFRAME_PASS' stella-parallax-test.log)" -eq 9
          python3 - <<'PY'
          import json
          from pathlib import Path
          line_prefix='PAI_STELLA_GEOMETRIC_PARALLAX_MULTIFRAME_PASS '
          records=[json.loads(line.split(line_prefix,1)[1]) for line in Path('stella-parallax-test.log').read_text().splitlines() if line_prefix in line]
          assert len(records)==9, f'Expected nine genuine 3D fixtures, found {len(records)}'
          successful=[r for r in records if r['nativePoses']>0 and r['firstPose'] is not None]
          assert successful, 'No genuinely computed Stella 6DoF pose in any geometrical fixture'
          print('PAI_STELLA_GENUINE_6DOF_INIT_PASS', json.dumps(successful))
          PY
          echo 'Real Stella WASM 3D fixture produced at least one native 6DoF pose; iPhone accuracy NOT established' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve exact sequence test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stella-fast-sequence-evidence
          path: |
            stella-validated-sha256.txt
            stella-25frame-test.log
            stella-parallax-test.log
          if-no-files-found: warn
          retention-days: 14
